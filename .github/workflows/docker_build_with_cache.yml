name: Docker Cache POC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./docker_cicd_test
          file: ./docker_cicd_test/Dockerfile

          # No hace push
          push: false

          # Para que realmente construya la imagen
          load: true

          cache-from: type=gha
          cache-to: type=gha,mode=max