name: Infrastructure Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Start Ministack
        run: |
          docker run -d \
            -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --name ministack \
            ministackorg/ministack:latest
          
      - name: Wait for Ministack Readiness
        run: |
          echo "Waiting for Ministack to be ready..."
          timeout 60s bash -c 'until curl -s http://localhost:4566/_ministack/health; do sleep 2; done'
          echo "Ministack is up!"


      - name: Configure MiniStack Environment
        run: |
          echo "AWS_ACCESS_KEY_ID=ministack" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=ministack" >> "$GITHUB_ENV"
          echo "AWS_REGION=us-east-1" >> "$GITHUB_ENV"
          echo "AWS_ENDPOINT_URL=http://localhost:4566" >> "$GITHUB_ENV"

      - name: Verify MiniStack
        run: |
          aws --endpoint-url "$AWS_ENDPOINT_URL" s3 ls

      - name: Validate Terraform
        run: |
          chmod +x scripts/validate_terraform.sh
          ./scripts/validate_terraform.sh